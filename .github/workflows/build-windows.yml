name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-gui.txt -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Prepare code-signing certificate
        if: vars.ZEE_SIGNING == '1'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          [IO.File]::WriteAllText("artifacts\code-sign.pfx.b64", $env:WINDOWS_CERT_BASE64)

      - name: Build bundle + installer
        run: scripts\build_windows.bat
        env:
          ZEE_SIGNING: ${{ vars.ZEE_SIGNING }}
          WINDOWS_CERT_BASE64_FILE: artifacts\code-sign.pfx.b64
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zee-windows
          path: artifacts/*
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true