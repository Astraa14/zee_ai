name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cross-platform dependencies
        run: pip install -r requirements-core.txt -r requirements-dev.txt

      - name: Install Windows-only extras
        if: runner.os == 'Windows'
        run: pip install -r requirements.txt

      - name: Syntax check (all modules)
        run: python -m compileall -q . -x "(^|/)(model|\.git|__pycache__|\.pytest_cache|\.ruff_cache|templates)(/|$)"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Import / smoke tests
        env:
          ZEE_HTTPS: "0"
          ZEE_TOKEN: "ci-test-token"
        run: pytest -v

      - name: Doctor report
        env:
          ZEE_HTTPS: "0"
        run: python zee_core.py --doctor || true

  packaging:
    name: packaging smoke (PyInstaller onedir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-core.txt -r requirements-dev.txt

      - name: Validate zee.spec syntax + bundled assets
        run: |
          python - <<'EOF'
          import ast, os
          ast.parse(open("zee.spec", encoding="utf-8").read())
          for path in ("templates/index.html", "scripts/build_windows.bat",
                       "scripts/make_installer.iss"):
              assert os.path.isfile(path), f"missing {path}"
          print("spec + assets OK")
          EOF

      - name: PyInstaller onedir build (headless smoke)
        env:
          ZEE_SMOKE_BUILD: "1"
        run: |
          python -m PyInstaller --noconfirm --clean zee.spec
          test -d dist/Zee
          test -f dist/Zee/zee || test -f dist/Zee/Zee
          echo "onedir bundle OK"

  packaging-windows:
    name: packaging (windows-latest bundle + smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-gui.txt -r requirements-dev.txt

      - name: Build onedir bundle (zee.spec)
        run: python -m PyInstaller --noconfirm --clean zee.spec

      - name: Smoke test the bundle
        run: .\dist\Zee\Zee.exe doctor --smoke
        env:
          ZEE_TOKEN: "ci-test-token"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: zee-windows-bundle
          path: dist/Zee
          if-no-files-found: error
