<!DOCTYPE html>
<html>

<head>
    <title>JARVIS Interface</title>
    <style>
        body {
            background-color: #04090b;
            color: #00f2ff;
            font-family: 'Segoe UI', Roboto, monospace;
            padding: 40px;
            text-align: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            letter-spacing: 5px;
            font-weight: 200;
            margin-bottom: 30px;
        }

        /* Arc Reactor */
        .arc-reactor {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            border: 2px solid #00f2ff;
            border-radius: 50%;
            box-shadow: inset 0 0 10px #00f2ff, 0 0 10px #00f2ff;
        }

        .outer {
            width: 100%;
            height: 100%;
            border-style: dashed;
            animation: rotate 20s linear infinite;
        }

        .middle {
            width: 80%;
            height: 80%;
            border-width: 4px;
            border-style: double;
            animation: rotate-reverse 15s linear infinite;
        }

        .inner {
            width: 60%;
            height: 60%;
            border-style: dotted;
            animation: pulse 2s ease-in-out infinite;
        }

        .core {
            width: 30%;
            height: 30%;
            background: radial-gradient(circle, #fff 0%, #00f2ff 60%);
            border-radius: 50%;
            box-shadow: 0 0 20px #00f2ff;
            z-index: 5;
            transition: all 0.5s ease;
            opacity: 0.5;
            /* Idle state */
        }

        /* Status States for Arc Reactor */
        .listening .core {
            opacity: 1;
            box-shadow: 0 0 50px #00f2ff;
        }

        .thinking .core {
            opacity: 1;
            background: radial-gradient(circle, #fff 0%, #b000ff 60%);
            box-shadow: 0 0 50px #b000ff;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotate-reverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        /* Button & Log */
        #mic-btn {
            background-color: rgba(0, 242, 255, 0.05);
            color: #00f2ff;
            border: 1px solid rgba(0, 242, 255, 0.5);
            padding: 15px 40px;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        #mic-btn:hover:not(:disabled) {
            background-color: #00f2ff;
            color: #000;
            box-shadow: 0 0 15px #00f2ff;
        }

        #mic-btn:disabled {
            border-color: #444;
            color: #555;
            cursor: not-allowed;
            background-color: transparent;
            box-shadow: none;
        }

        #log {
            width: 80%;
            height: 40vh;
            border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 20px;
            text-align: left;
            overflow-y: auto;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }

        .user-text {
            color: #fff;
            margin-top: 10px;
        }

        .jarvis-text {
            color: #00f2ff;
            margin-top: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .status-text {
            color: #666;
            font-style: italic;
            font-size: 12px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 255, 0.3);
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>J.A.R.V.I.S. CORE UI</h1>

    <div class="arc-reactor" id="reactor">
        <div class="ring outer"></div>
        <div class="ring middle"></div>
        <div class="ring inner"></div>
        <div class="core"></div>
    </div>

    <button id="mic-btn" onclick="startListening()">Activate Microphone</button>
    
    <!-- Text input fallback -->
    <div style="margin: 20px 0;">
        <input type="text" id="text-input" placeholder="Type command here..." 
               style="padding: 10px; width: 300px; background: rgba(0,0,0,0.5); 
                      border: 1px solid rgba(0, 242, 255, 0.5); color: #00f2ff; 
                      border-radius: 5px; font-family: inherit;">
        <button onclick="sendText()" style="padding: 10px 20px; background: rgba(0, 242, 255, 0.1); 
                border: 1px solid rgba(0, 242, 255, 0.5); color: #00f2ff; 
                border-radius: 5px; cursor: pointer; margin-left: 10px;">Send</button>
    </div>
    
    <div id="log"></div>

    <!-- Approval dialog for dangerous actions -->
    <div id="approval-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; flex-direction:column;">
        <div style="border:1px solid rgba(0,242,255,0.5); background:#061316; padding:30px 40px; border-radius:10px; max-width:420px; text-align:center; box-shadow:0 0 30px rgba(0,242,255,0.2);">
            <h2 style="color:#00f2ff; font-weight:200; letter-spacing:3px; margin-top:0;">AUTHORIZATION REQUIRED</h2>
            <p id="approval-message" style="color:#fff;"></p>
            <div style="display:flex; gap:15px; justify-content:center; margin-top:25px;">
                <button id="approve-btn" style="padding:10px 25px; background:#00f2ff; color:#000; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">APPROVE</button>
                <button id="deny-btn" style="padding:10px 25px; background:transparent; color:#00f2ff; border:1px solid #00f2ff; border-radius:5px; cursor:pointer;">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        const logDiv = document.getElementById('log');
        const micBtn = document.getElementById('mic-btn');
        const reactor = document.getElementById('reactor');

        // Tap into Chrome's built-in AI Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        recognition.onstart = function () {
            // Update UI State to Listening
            micBtn.disabled = true;
            micBtn.textContent = "LISTENING...";
            reactor.className = "arc-reactor listening";
            logDiv.innerHTML += `<div class="status-text">Audio channel open. Awaiting user input...</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        };

        recognition.onresult = function (event) {
            const text = event.results[0][0].transcript;
            logDiv.innerHTML += `<div class="user-text"><b>You:</b> ${text}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;

            // Update UI State to Thinking (Purple)
            micBtn.textContent = "PROCESSING...";
            reactor.className = "arc-reactor thinking";
            logDiv.innerHTML += `<div class="status-text">Querying cognitive processor...</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;

            // Send the text to our Python Backend
            sendAsk(text);
        };

        recognition.onerror = function (event) {
            logDiv.innerHTML += `<div class="status-text" style="color: red;">Microphone error: ${event.error}</div>`;
            resetUI();
        };

        recognition.onend = function () {
            // If it ends without a result (user didn't say anything)
            if (reactor.classList.contains("listening")) {
                logDiv.innerHTML += `<div class="status-text">Audio channel closed.</div>`;
                resetUI();
            }
        };

        function startListening() {
            try {
                recognition.start();
            } catch (e) {
                // Ignore if already started
            }
        }

        function resetUI() {
            micBtn.disabled = false;
            micBtn.textContent = "ACTIVATE MICROPHONE";
            reactor.className = "arc-reactor idle";
        }

        function sendText() {
            const textInput = document.getElementById('text-input');
            const text = textInput.value.trim();
            
            if (text) {
                logDiv.innerHTML += `<div class="user-text"><b>You:</b> ${text}</div>`;
                logDiv.scrollTop = logDiv.scrollHeight;
                textInput.value = '';

                // Update UI State to Thinking (Purple)
                reactor.className = "arc-reactor thinking";
                logDiv.innerHTML += `<div class="status-text">Querying cognitive processor...</div>`;
                logDiv.scrollTop = logDiv.scrollHeight;

                // Send the text to our Python Backend
                sendAsk(text);
            }
        }

        // ==========================================
        // Shared ask flow (mic + text input)
        // ==========================================
        let pendingApprovalId = null;

        function sendAsk(text) {
            fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
                .then(response => response.json())
                .then(handleAskResponse)
                .catch(err => {
                    logDiv.innerHTML += `<div class="status-text" style="color: red;">Error contacting core.</div>`;
                    resetUI();
                });
        }

        function handleAskResponse(data) {
            logDiv.innerHTML += `<div class="jarvis-text"><b>JARVIS:</b> ${data.reply}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;

            if (data.approval_id) {
                pendingApprovalId = data.approval_id;
                document.getElementById('approval-message').textContent =
                    data.approval_message || 'JARVIS is requesting to take an action on this computer.';
                document.getElementById('approval-overlay').style.display = 'flex';
                return;
            }
            resetUI();
        }

        function closeApproval() {
            document.getElementById('approval-overlay').style.display = 'none';
            pendingApprovalId = null;
            resetUI();
        }

        document.getElementById('approve-btn').addEventListener('click', function () {
            const id = pendingApprovalId;
            closeApproval();
            if (!id) return;
            fetch('/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approval_id: id })
            })
                .then(response => response.json())
                .then(data => {
                    logDiv.innerHTML += `<div class="jarvis-text"><b>JARVIS:</b> ${data.message || 'Done.'}</div>`;
                    logDiv.scrollTop = logDiv.scrollHeight;
                })
                .catch(() => {
                    logDiv.innerHTML += `<div class="status-text" style="color: red;">Approval failed.</div>`;
                });
        });

        document.getElementById('deny-btn').addEventListener('click', function () {
            const id = pendingApprovalId;
            closeApproval();
            if (!id) return;
            fetch('/deny', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approval_id: id })
            });
        });

        // Allow Enter key to send text
        document.getElementById('text-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendText();
            }
        });
    </script>
</body>

</html>
